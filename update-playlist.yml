name: Update IPTV playlist

on:
  schedule:
    # каждый день в 06:00 UTC (10:00 по Баку)
    - cron: "0 6 * * *"
  workflow_dispatch: {}   # можно запустить вручную кнопкой в GitHub

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests

      - name: Build & check playlist
        run: python3 build_playlist.py

      - name: Commit updated playlist
        run: |
          git config user.name "iptv-bot"
          git config user.email "iptv-bot@users.noreply.github.com"
          git add cis_and_az_channels.m3u check_report.json
          git diff --cached --quiet || git commit -m "Auto-update playlist $(date -u +%F)"
          git push
